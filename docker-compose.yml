services:
  db:
    image: postgres:17
    container_name: incidencias-db
    environment:
      POSTGRES_DB: incidencias
      POSTGRES_USER: incidencias
      # La contraseña se lee de .env (no versionado). Si falta, compose se detiene con este mensaje.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD. Copia .env.example a .env}
    ports:
      # 5433 en el host para no chocar con un PostgreSQL instalado localmente en el 5432.
      # 127.0.0.1: la BD solo es accesible desde este equipo, no desde otros de la red.
      - "127.0.0.1:5433:5432"
    volumes:
      # Volumen con nombre: los datos sobreviven a "docker compose down" (no a "down -v").
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidencias -d incidencias"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
