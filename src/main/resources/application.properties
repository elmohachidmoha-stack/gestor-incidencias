spring.application.name=gestor-incidencias

# Puerto HTTP: 8081 por defecto (en el equipo de desarrollo el 8080 está ocupado por otro servicio).
# Se puede cambiar con la variable de entorno SERVER_PORT.
server.port=${SERVER_PORT:8081}

# Si no se indica ningún perfil al arrancar, se usa "local" (carga application-local.properties,
# que tiene la contraseña y NO se sube a Git). En CI o Docker se puede activar otro perfil o
# pasar variables de entorno.
spring.profiles.default=local

# --- Base de datos ---
# Cada valor se puede sobrescribir con una variable de entorno (DB_URL, DB_USERNAME, DB_PASSWORD);
# si no existe, se usa el valor tras los dos puntos (pensado para desarrollo local).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/incidencias}
spring.datasource.username=${DB_USERNAME:incidencias}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate ---
# El esquema lo gestiona Flyway; Hibernate solo comprueba que las entidades encajan con las tablas
# y falla al arrancar si no es así. Nunca crea ni modifica tablas.
spring.jpa.hibernate.ddl-auto=validate
# Desactiva "Open Session In View": la sesión de BD no se mantiene abierta durante toda la
# petición HTTP. Evita consultas perezosas ocultas desde el controller y conexiones retenidas.
spring.jpa.open-in-view=false

# --- Flyway ---
# Las migraciones están en src/main/resources/db/migration (ubicación por defecto).
spring.flyway.enabled=true

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
